name: Module Sync

on:
  pull_request:
  push:
    branches: [main]

jobs:
  module-sync:
    name: AppSidebar ↔ LobbyEcosystem sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run module-sync vitest suite
        run: bunx vitest run src/test/module-sync.test.ts --reporter=verbose
